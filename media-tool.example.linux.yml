exiftool:
  # Only to use manually installed exiftool instance.
  # Better to use OS preinstalled version, e.g. `/usr/bin/exiftool` from `sudo apt install exiftooll`
  path: $APP_DIR/exiftool
  # or 
  #path: /opt/exiftool

  # Where to tore Exiftool _original files:
  # none - (danger!) do not keep, will lead to `-overwrite_original` usage
  # in_place - leave original files in working dir
  # directory, e.g. ~/tmp - move original files to specified place
  store_original: ~/tmp/media_backup
import:
  goPro:
    default:
      targetDir: ~/Media/gopro
  camVideo:
    default:
      targetDir: ~/Media/camera
  sdPhotos:
    default:
      targetDir: ~/Media/photos
